name: xnu

on:
  workflow_dispatch:
    inputs:
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main]
    paths:
      - "xnu/patches/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  UPSTREAM_REPO: https://github.com/dipa-studio/ios-sweet
  UPSTREAM_SHA: 45263bee51df4a0f55cdf9c649af886399488ddb
  MACOS_VERSION: "13.5"
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: CAMELLIA

jobs:
  build:
    # macos-14 ships Xcode 15.x, whose iig matches the xnu-8796 IORPC ABI
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script and upstream patches
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # upstream ios-sweet carries 0001-0081 (SWEET bring-up); this repo only 0082+
          git init -q upstream
          git -C upstream fetch -q --depth 1 "$UPSTREAM_REPO" "$UPSTREAM_SHA"
          git -C upstream checkout -q FETCH_HEAD
          cp upstream/xnu/patches/*.patch upstream/xnu/patches/*.sh dxb/patches/
          cp xnu/patches/*.patch dxb/patches/
          # Upstream stage scripts bail out unless MACHINE_CONFIG is SWEET; the
          # camellia kernel needs the same staged sources (bearssl, hfs, pthread).
          sed -i '' 's/\[\[ "${MACHINE_CONFIG:-}" == SWEET \]\] || exit 0/[[ "${MACHINE_CONFIG:-}" == SWEET || "${MACHINE_CONFIG:-}" == CAMELLIA ]] || exit 0/' dxb/patches/*.sh
          grep -h 'MACHINE_CONFIG' dxb/patches/*.sh
          # libfirehose_kernel is built arm64e-only; this kernel is plain arm64
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          grep -c 'VALID_ARCHS="x86_64 arm64e arm64"' dxb/build.sh
          ls dxb/patches | wc -l
          ls dxb/patches | tail -8

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists; Xcode is preinstalled
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Build
        working-directory: dxb
        env:
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: bash build.sh

      - name: Collect kernel
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn
